<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: when the on-screen keyboard opens,
         shrink the LAYOUT viewport rather than just scrolling the visual one,
         so `h-dvh` gives back the keyboard's space and the composer stays on
         screen. Chromium honours this; Safari is handled by the visual-viewport
         fallback in app/lib/hooks/useViewport.ts. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Paints the phone's status bar and address bar the same warm paper the
         page is on, so the browser chrome stops framing the app in white. -->
    <meta name="theme-color" content="#FCFBF9" />
    <title>Sevi | CvSU Virtual Assistant</title>
    <meta name="description" content="Sevi is the CvSU Virtual Assistant — ask about admissions, enrollment, programs, scholarships, campus directions, and more." />

    <!-- Root-relative: Vite rewrites these to <base> + path at build time, so
         they resolve under /diwa/ on Pages AND under / in the Docker image.
         They were absolute to godwincreates.net, which made every non-Pages
         deployment fetch its favicon cross-origin from a personal domain. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph (Facebook / Messenger / iMessage / Slack / Discord).
         These stay ABSOLUTE on purpose: scrapers do not resolve relative URLs,
         and Vite only rewrites them to root-relative, which is not enough. The
         origin below is the unresolved production-domain question tracked under
         Open items in README.md — change it there, in one place, when the
         cvsu.edu.ph host lands. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://godwincreates.net/diwa/" />
    <meta property="og:title" content="Sevi — CvSU Virtual Assistant" />
    <meta property="og:description" content="Ask about CvSU admissions, enrollment, programs, scholarships, and campus directions. English, Filipino, and Taglish supported." />
    <meta property="og:image" content="https://godwincreates.net/diwa/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Cavite State University" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sevi — CvSU Virtual Assistant" />
    <meta name="twitter:description" content="Ask about CvSU admissions, enrollment, programs, scholarships, and campus directions." />
    <meta name="twitter:image" content="https://godwincreates.net/diwa/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>

    <!--
      Sevi chat widget. On the marketing landing page this drops a green
      chat bubble bottom-right and (first visit) auto-opens after 3s.
      On the embed page (?embed=1), widget.js self-detects and stays out
      of the way so the chat iframe doesn't nest itself.
    -->
    <script
      src="/widget.js"
      data-diwa-url="%BASE_URL%"
      data-diwa-color="#16803c"
      data-diwa-position="bottom-right"
      data-diwa-label="Chat with Sevi"
      data-diwa-open-after="3000"
      data-diwa-remember="closed"
      async
    ></script>
  </body>
</html>
