# Serves the built SeviWeb SPA and reverse-proxies /api/* to the SeviAI
# container (compose service "api"), stripping the /api prefix — the same
# rewrite the Vite dev proxy does (vite.config.ts).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving via a variable (instead of a static
    # proxy_pass host) makes nginx re-resolve "api" on each request, so it
    # survives the api container being recreated with a new IP — and lets
    # nginx start even if the api container isn't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Admin intent saves can carry the full intents JSON
    client_max_body_size 10m;

    location /api/ {
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM fallback answers can be slow; don't buffer or time out early
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Hashed build assets are immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
