# Serves the built SeviWeb SPA and reverse-proxies /api/* to the SeviAI
# container (compose service "api"), stripping the /api prefix — the same
# rewrite the Vite dev proxy does (vite.config.ts).

# TLS never terminates in this container, so $scheme is always "http" here.
# Setting X-Forwarded-Proto from $scheme clobbered the "https" a fronting
# proxy reported, and the API then emitted http:// charter citation links
# (api/charter_pages.py resolves the link origin from these headers). Pass
# through whatever the edge set; fall back to $scheme only when nothing
# upstream sent one (hitting the container directly, e.g. local :8090).
# Trusting the client's header is fine here for the same reason it is in the
# API: the origin is request-scoped, so a forged value only alters the links
# in the forger's own reply — it never affects rate limiting (that trust is
# TRUSTED_CLIENT_IP_HEADER, explicitly opt-in on the API).
#
# Contract for whatever proxy fronts this stack (e.g. the CvSU edge for
# sevi.cvsu.edu.ph): send `X-Forwarded-Proto: https` and, if it rewrites Host
# to the upstream name, also `X-Forwarded-Host: <public host>` — otherwise
# the internal hostname leaks into citation links.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Relative Location headers. nginx builds absolute redirects from its own
    # listen port (8080), not the published one, so `location = /admin`'s 301
    # sent the browser to http://<host>:8080/admin/ — a port nothing is
    # published on. Found by smoke-testing the charter link fix.
    absolute_redirect off;

    # Docker's embedded DNS. Resolving via a variable (instead of a static
    # proxy_pass host) makes nginx re-resolve "api" on each request, so it
    # survives the api container being recreated with a new IP — and lets
    # nginx start even if the api container isn't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Admin intent saves can carry the full intents JSON
    client_max_body_size 10m;

    location /api/ {
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        # $http_host, NOT $host: $host drops the port, and the API builds the
        # charter citation link from the Host of the CHAT request
        # (api/charter_pages.py). With $host, a stack published on any port but
        # 80 emitted http://<host>/sources/… — the right host, the wrong port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # Empty when the edge sent none — nginx then drops the header and the
        # API falls back to Host, which is correct for a direct deployment.
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;

        # LLM fallback answers can be slow; don't buffer or time out early
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # The Citizens' Charter PDF, served by the API at /sources/…, must be
    # reachable on THIS origin — a charter citation deep-links the origin that
    # served the chat request (api/charter_pages.py resolves it from the Host
    # header), and behind this proxy that is the web origin, not api:8000.
    # Without this block the link fell through to the SPA fallback below and
    # returned index.html with a 200, so "#page=997" opened the chat app
    # instead of the charter.
    location /sources/ {
        set $sources_upstream http://api:8000;
        proxy_pass $sources_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;

        # 13 MB PDF: stream it rather than buffering the whole body to disk.
        proxy_buffering off;
    }

    # Hashed build assets are immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA entry point must never be cached. Assets are content-hashed and
    # immutable (above), but if index.html is heuristically cached the browser
    # keeps pointing at old asset hashes after a redeploy — which is how the
    # embedded widget iframe kept serving a stale bundle (old greeting) even
    # after a new build. Force revalidation so deploys take effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Admin app — a SEPARATE Vite entry (admin/index.html), not part of the chat SPA.
    # Served here explicitly so it does NOT fall through to the SPA fallback
    # below, which would hand back index.html (the public chat app) instead.
    # This is also the single place to bolt on edge auth (Cloudflare Access,
    # an allowlist, or mTLS) when Phase 3 lands — the whole admin surface is
    # addressable by this one prefix.
    # Same no-cache reasoning as index.html above: admin/index.html references
    # content-hashed bundles, so a heuristically cached copy would keep pointing
    # at stale asset hashes after a redeploy.
    location = /admin { return 301 /admin/; }
    location /admin/ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /admin/index.html =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
