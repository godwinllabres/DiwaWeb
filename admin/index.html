      admin bundle and the public chat bundle share no entry chunk. The public

      Twitter cards, and the marketing description. This page is an operator
      tool, not a shareable surface.
    -->

    <meta name="referrer" content="same-origin" />

    <link rel="icon" type="image/png" sizes="32x32" href="https://godwincreates.net/diwa/favicon-32.png" />
