name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /diwa/

      # Move build output into /diwa/ subdirectory
      - run: |
          mkdir -p staging/diwa
          cp -r dist/* staging/diwa/
          cp dist/index.html staging/diwa/404.html
          cp public/CNAME staging/CNAME
          # Root redirect: godwincreates.net → godwincreates.net/diwa/
          cat > staging/index.html << 'REDIRECT'
          <!DOCTYPE html>
          <html><head>
            <meta http-equiv="refresh" content="0;url=/diwa/" />
            <link rel="canonical" href="/diwa/" />
          </head><body>
            <p>Redirecting to <a href="/diwa/">DIWA</a>...</p>
          </body></html>
          REDIRECT
          # SPA fallback at root level
          cp staging/diwa/404.html staging/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
