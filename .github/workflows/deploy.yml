name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Single source of truth — .nvmrc also drives `nvm use` locally and
          # is the version Dockerfile pins. Do not hardcode it here again.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Build BEFORE test on purpose: tests/build/adminSplit.test.ts inspects
      # dist/assets to prove the public bundle ships no admin code, so it needs
      # an artifact to read. `npm run build` also runs `tsc -b`, so this is the
      # typecheck gate too.
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /diwa/

      # Nothing is published until this passes: the upload step below is in the
      # same job, and `deploy` declares `needs: build`.
      - run: npm test

      # Move build output into /diwa/ subdirectory
      - run: |
          mkdir -p staging/diwa
          cp -r dist/* staging/diwa/
          cp dist/index.html staging/diwa/404.html
          cp public/CNAME staging/CNAME
          # Root redirect: godwincreates.net → godwincreates.net/diwa/
          # Includes OG tags so previews work even when the apex URL is pasted
          # (most chat-app scrapers don't follow meta-refresh, so the preview
          # has to live on this page too — not just /diwa/).
          cat > staging/index.html << 'REDIRECT'
          <!DOCTYPE html>
          <html lang="en"><head>
            <meta charset="UTF-8" />
            <title>DIWA | CvSU Digital Intelligent Web Assistant</title>
            <meta name="description" content="DIWA is the CvSU Digital Intelligent Web Assistant — ask about admissions, enrollment, programs, scholarships, and campus directions." />
            <link rel="icon" type="image/png" sizes="32x32" href="/diwa/favicon-32.png" />
            <link rel="apple-touch-icon" sizes="180x180" href="/diwa/apple-touch-icon.png" />
            <meta property="og:type" content="website" />
            <meta property="og:url" content="https://godwincreates.net/diwa/" />
            <meta property="og:title" content="DIWA — CvSU Digital Intelligent Web Assistant" />
            <meta property="og:description" content="Ask about CvSU admissions, enrollment, programs, scholarships, and campus directions. English, Filipino, and Taglish supported." />
            <meta property="og:image" content="https://godwincreates.net/diwa/og-image.jpg" />
            <meta property="og:image:width" content="1200" />
            <meta property="og:image:height" content="630" />
            <meta property="og:site_name" content="Cavite State University" />
            <meta name="twitter:card" content="summary_large_image" />
            <meta name="twitter:title" content="DIWA — CvSU Digital Intelligent Web Assistant" />
            <meta name="twitter:description" content="Ask about CvSU admissions, enrollment, programs, scholarships, and campus directions." />
            <meta name="twitter:image" content="https://godwincreates.net/diwa/og-image.jpg" />
            <link rel="canonical" href="/diwa/" />
            <script>location.replace('/diwa/' + location.search + location.hash)</script>
            <noscript><meta http-equiv="refresh" content="0;url=/diwa/" /></noscript>
          </head><body>
            <p>Redirecting to <a href="/diwa/">DIWA</a>...</p>
          </body></html>
          REDIRECT
          # SPA fallback at root level
          cp staging/diwa/404.html staging/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
