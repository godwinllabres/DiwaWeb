name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Single source of truth — .nvmrc also drives `nvm use` locally and
          # is the version Dockerfile pins. Do not hardcode it here again.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Build BEFORE test on purpose: tests/build/adminSplit.test.ts inspects
      # dist/assets to prove the public bundle ships no admin code, so it needs
      # an artifact to read. `npm run build` also runs `tsc -b`, so this is the
      # typecheck gate too.
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /

      # Nothing is published until this passes: the upload step below is in the
      # same job, and `deploy` declares `needs: build`. Coverage thresholds are
      # enforced here (vitest.config.ts), so a drop fails the deploy too.
      - run: npm run test:coverage

      # The chatbot has its own host: diwa.godwincreates.net.
      # Publish the application at / and keep the SPA fallback.
      - run: |
          mkdir -p staging
          cp -r dist/* staging/
          cp dist/index.html staging/404.html
          cp public/CNAME staging/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
