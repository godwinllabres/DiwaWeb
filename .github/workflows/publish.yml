# Build the SeviWeb image and publish it to this repo's own GHCR namespace.
# Uses the built-in GITHUB_TOKEN, which always has access to its OWN repo and
# to packages owned by this repo's owner — so no cross-repo PAT or org token
# approval is ever needed. sevi-deploy then just pulls the published image.
name: Publish web image (GHCR)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: publish-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name (ghcr.io/<owner>/<repo>, lowercased)
        id: ns
        # Name the image after the repo itself so GHCR auto-links the package to
        # THIS repo — avoids the 403 from a pre-existing "sevi-web" package that a
        # different repo already owns.
        run: echo "img=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.ns.outputs.img }}:latest
            ${{ steps.ns.outputs.img }}:${{ github.sha }}
          cache-from: type=gha,scope=sevi-web
          cache-to: type=gha,mode=max,scope=sevi-web

      - name: Summary
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.ns.outputs.img }}:latest  (+ :${{ github.sha }})"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
